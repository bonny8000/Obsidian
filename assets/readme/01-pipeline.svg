<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">LLM-Wiki ingest pipeline</title>
  <desc id="desc">Raw sources are preserved, compiled into source records, linked into concept pages, and synthesized into maps, analyses, comparisons, and decisions.</desc>
  <rect width="1200" height="340" rx="24" fill="#FBFBFE"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7077FB" letter-spacing="2">PIPELINE</text>
  <text x="60" y="94" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2B3040">Raw material becomes reasoned knowledge</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="14" fill="#7C7E92">Every ingest preserves evidence first, then compiles source-grounded wiki pages.</text>

  <rect x="60" y="148" width="240" height="120" rx="18" fill="#F1F4F9"/>
  <circle cx="96" cy="184" r="16" fill="#DCE0EB"/>
  <text x="96" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">1</text>
  <text x="124" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3040">Capture in raw/</text>
  <text x="84" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">PDFs, web pages, notes, transcripts</text>
  <text x="84" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Immutable evidence layer</text>

  <path d="M312 208h34" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M340 202l8 6-8 6" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="360" y="148" width="240" height="120" rx="18" fill="#F1F4F9"/>
  <circle cx="396" cy="184" r="16" fill="#DCE0EB"/>
  <text x="396" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">2</text>
  <text x="424" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3040">Create sources/</text>
  <text x="384" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Provenance, claims, caveats</text>
  <text x="384" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">LLM-ready source records</text>

  <path d="M612 208h34" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M640 202l8 6-8 6" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="660" y="148" width="240" height="120" rx="18" fill="#F1F4F9"/>
  <circle cx="696" cy="184" r="16" fill="#DCE0EB"/>
  <text x="696" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">3</text>
  <text x="724" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3040">Link concepts/</text>
  <text x="684" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Reusable ideas, methods, frameworks</text>
  <text x="684" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Obsidian knowledge graph</text>

  <path d="M912 208h34" stroke="#7077FB" stroke-width="2"/>
  <path d="M940 202l8 6-8 6" fill="none" stroke="#7077FB" stroke-width="2"/>

  <rect x="960" y="148" width="180" height="120" rx="18" fill="#E7E8FC"/>
  <circle cx="996" cy="184" r="16" fill="#7077FB"/>
  <text x="996" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1024" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7077FB">Synthesize</text>
  <text x="984" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Maps, analyses, comparisons</text>
  <text x="984" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Decisions and playbooks</text>

  <text x="60" y="306" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">The raw source remains the authority; wiki pages are compiled interfaces for search, synthesis, and reuse.</text>
</svg>
