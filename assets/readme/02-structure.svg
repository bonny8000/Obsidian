<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Arial, 'Noto Sans TC', sans-serif">
  <!-- Bonny Slide System · light-periwinkle theme · evidence pyramid -->
  <rect width="1200" height="420" rx="24" fill="#FBFBFE"/>

  <text x="60" y="64" font-size="15" font-weight="700" fill="#7077FB" letter-spacing="2">STRUCTURE</text>
  <text x="60" y="92" font-size="22" font-weight="700" fill="#2B3040">三層知識庫 <tspan fill="#7C7E92" font-size="15" font-weight="400">evidence → knowledge → conclusions</tspan></text>

  <!-- layer 3 · conclusions (accent) -->
  <rect x="330" y="122" width="540" height="72" rx="18" fill="#E7E8FC"/>
  <text x="600" y="152" font-size="17" font-weight="700" fill="#7077FB" text-anchor="middle">結論層 conclusions</text>
  <text x="600" y="176" font-size="13" fill="#7C7E92" text-anchor="middle">analyses 綜合備忘 · comparisons 決策表 · decisions 決策紀錄</text>

  <path d="M600 206v14" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M594 208l6 -8 6 8" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <!-- layer 2 · knowledge -->
  <rect x="210" y="228" width="780" height="72" rx="18" fill="#F1F4F9"/>
  <text x="600" y="258" font-size="17" font-weight="700" fill="#2B3040" text-anchor="middle">知識層 wiki/</text>
  <text x="600" y="282" font-size="13" fill="#7C7E92" text-anchor="middle">311 concepts(7 領域) · 161 sources · 73 queries · 17 maps · 14 methods</text>

  <path d="M600 312v14" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M594 314l6 -8 6 8" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <!-- layer 1 · evidence -->
  <rect x="90" y="334" width="1020" height="60" rx="18" fill="#FFFFFF" stroke="#DCE0EB" stroke-width="2"/>
  <text x="600" y="360" font-size="16" font-weight="700" fill="#2B3040" text-anchor="middle">證據層 raw/ <tspan font-weight="400" fill="#7C7E92" font-size="13">168 原始檔(文章、PDF、逐字稿) · 唯讀 immutable · 每條主張的最終依據</tspan></text>
</svg>
