<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LLM-Wiki evidence structure</title>
  <desc id="desc">The vault separates raw evidence, linked wiki knowledge, and synthesized conclusions.</desc>
  <rect width="1200" height="420" rx="24" fill="#FBFBFE"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7077FB" letter-spacing="2">STRUCTURE</text>
  <text x="60" y="94" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2B3040">Evidence, knowledge, and conclusions stay separate</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="14" fill="#7C7E92">This keeps AI synthesis useful without letting it replace the source of truth.</text>

  <rect x="330" y="138" width="540" height="78" rx="18" fill="#E7E8FC"/>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7077FB" text-anchor="middle">Synthesis layer</text>
  <text x="600" y="194" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92" text-anchor="middle">Analyses, comparisons, playbooks, maps, decisions</text>

  <path d="M600 228v20" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M594 232l6-8 6 8" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="210" y="256" width="780" height="78" rx="18" fill="#F1F4F9"/>
  <text x="600" y="288" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3040" text-anchor="middle">Compiled wiki layer</text>
  <text x="600" y="312" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92" text-anchor="middle">162 sources, 317 concepts, 14 methods, 15 maps, 73 saved queries</text>

  <path d="M600 346v18" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M594 350l6-8 6 8" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="90" y="370" width="1020" height="34" rx="17" fill="#FFFFFF" stroke="#DCE0EB" stroke-width="2"/>
  <text x="600" y="392" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">Raw evidence layer: 296 preserved files in raw/</text>
</svg>
